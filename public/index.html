<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Bot</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="graph.css">
</head>
<body>
  <div id="app">

    <!-- Top toolbar: full width so controls never crowd when the chat shrinks -->
    <div id="top-bar">
      <button id="left-toggle" title="Toggle conversation list">☰</button>
      <span id="current-title">New conversation</span>
      <button id="view-toggle" title="Switch between list view and graph view">🗺<span class="btn-label"> Graph</span></button>
      <button id="explains-toggle" class="hidden" title="Show explain windows">💡 <span class="btn-label">Explains</span> <span id="explains-count">0</span></button>
      <button id="summary-btn" title="Topics summary of this conversation">📋<span class="btn-label"> Summary</span></button>
      <button id="library-btn" title="Library — every file you uploaded">📚<span class="btn-label"> Library</span></button>
      <div id="model-wrap" title="Model">
        <span id="model-icon">🤖</span>
        <select id="model-select" title="Model"></select>
      </div>
    </div>

    <div id="main-row">

    <!-- Left sidebar: conversation history -->
    <aside id="left-sidebar">
      <div class="left-header">
        <span class="logo">🎓 Learning Bot</span>
      </div>
      <button id="new-chat-btn">+ New Chat</button>
      <div id="conversation-list"></div>
      <!-- Static footer: active provider/model + settings entry -->
      <div id="sidebar-footer">
        <div id="footer-model" title="Active provider and model">🤖 …</div>
        <div id="footer-info" hidden title="Context window and usage limits"></div>
        <button id="settings-btn" title="Provider & API settings">⚙ Settings</button>
      </div>
    </aside>

    <!-- Main chat area -->
    <main id="chat-area">
      <div id="messages"></div>

      <form id="input-form">
        <div id="attach-chips" hidden></div>
        <button type="button" id="attach-btn" title="Attach a file — or drag &amp; drop onto the input">＋</button>
        <button type="button" id="link-btn" title="Attach a link">🔗</button>
        <textarea id="input" rows="1" placeholder="Ask anything...  (Enter to send, Shift+Enter for new line)"></textarea>
        <button type="submit" id="send-btn" title="Send">
          <svg class="send-idle" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M6.6 11.6 12 6.2l5.4 5.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="send-busy" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>
      </form>
      <input type="file" id="file-input" multiple hidden
             accept=".pdf,.docx,.txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,.log,.xml,.yml,.yaml">
    </main>

    <!-- Drag handle to resize the explain sidebar -->
    <div id="resize-handle"></div>

    <!-- Right sidebar: explainer containers (recursive vertical splits) -->
    <aside id="right-sidebar">
      <div id="sidebar-header">
        <div id="explain-tabs" title="Root explainer containers (created from the main chat)"></div>
        <div class="sidebar-actions">
          <button id="sidebar-reset" title="Clear this container's conversation">↺</button>
          <button id="sidebar-close" title="Hide panel (containers are kept)">✕</button>
        </div>
      </div>
      <div id="explainer-body">
        <div id="explain-panels"></div>
        <div id="summary-overlay" class="hidden">
          <div class="summary-head">
            <span class="summary-title">📋 Topics — what I've learned</span>
            <span id="summary-status"></span>
            <span id="test-badges" title="Tests taken"></span>
            <button id="summary-refresh" title="Regenerate summary & test now">↻</button>
            <button id="summary-close" title="Close (containers stay)" class="summary-x">✕</button>
          </div>
          <div id="summary-body">
            <div id="summary-card-slot"></div>
            <div id="test-section"></div>
          </div>
        </div>
        <div id="settings-overlay" class="hidden">
          <div class="summary-head">
            <span class="summary-title">⚙ Settings</span>
            <span id="settings-status"></span>
            <button id="settings-close" title="Close (containers stay)" class="summary-x">✕</button>
          </div>
          <div id="settings-body">
            <label class="set-label" for="set-provider">Model provider</label>
            <select id="set-provider"></select>

            <div id="set-key-row">
              <label class="set-label" for="set-key">API key</label>
              <input id="set-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
            </div>

            <div id="set-base-row">
              <label class="set-label" for="set-base">Base URL <span class="set-inline-hint">(optional — OpenAI-compatible endpoints)</span></label>
              <input id="set-base" type="text" placeholder="https://api.openai.com/v1" spellcheck="false">
            </div>

            <div class="set-actions">
              <button id="set-connect">Connect</button>
            </div>
            <div id="set-message" class="set-message"></div>
          </div>
        </div>
        <div id="library-overlay" class="hidden">
          <div class="summary-head">
            <span class="summary-title">📚 Library — every file</span>
            <span id="library-status"></span>
            <button id="library-close" title="Close" class="summary-x">✕</button>
          </div>
          <div id="library-body"></div>
        </div>
      </div>
    </aside>

    <section id="graph-view" class="hidden" aria-label="Graph view">
      <div id="graph-scroll">
        <div id="graph-canvas">
          <svg id="graph-edges" aria-hidden="true">
            <defs>
              <marker id="garrow" viewBox="0 0 10 10" refX="8.5" refY="5"
                      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0 0 L10 5 L0 10 Z"/>
              </marker>
              <marker id="garrow-on" viewBox="0 0 10 10" refX="8.5" refY="5"
                      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0 0 L10 5 L0 10 Z"/>
              </marker>
            </defs>
            <g id="graph-paths"></g>
          </svg>
          <div id="graph-nodes"></div>
          <div id="graph-empty" class="hidden">
            <b>Nothing here yet</b>
            Start a chat — its explanations will branch off to the right.
          </div>
        </div>
      </div>
      <div id="graph-rail">
        <button id="rail-settings" title="Provider & API settings">⚙</button>
      </div>
    </section>

    </div><!-- /#main-row -->

  </div><!-- /#app -->

  <!-- Floating popup shown when text is selected -->
  <div id="selection-popup">
    <button type="button" data-act="explain" title="Explain in a side panel">💡 Explain</button>
    <button type="button" data-act="note" title="Save to my notes in the summary">📌 Note</button>
  </div>

  <!-- Shown next to a container's ✕: closing deletes it permanently. -->
  <div id="confirm-popup">
    <div class="confirm-msg"></div>
    <div class="confirm-actions">
      <button type="button" class="confirm-cancel">Cancel</button>
      <button type="button" class="confirm-ok">Delete</button>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
