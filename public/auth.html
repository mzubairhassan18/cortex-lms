<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex — sign in</title>
  <meta name="description" content="Sign in to Cortex with Google or an email link.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/landing.css">
  <script>
    /* Same key and same no-flash trick as the app and the landing page. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('lb.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* Auth-only layout. Everything else — colour, type, buttons — comes from
       landing.css so this page cannot drift from the marketing site. */
    .auth-wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 460px;
      margin: 0 auto;
      padding: 24px 20px;
      gap: 24px;
    }
    .auth-top { display: flex; align-items: center; justify-content: space-between; }
    .auth-card {
      align-self: center;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px 26px 26px;
      box-shadow: 0 24px 60px -30px var(--shadow);
    }
    .auth-card h1 {
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }
    .auth-sub { color: var(--text-dim); font-size: 14.5px; margin: 0 0 22px; }
    .auth-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px 16px; font-size: 15px; font-weight: 600;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg-raise); color: var(--text); cursor: pointer;
      text-decoration: none; transition: border-color .15s, transform .15s;
    }
    .auth-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .auth-btn[disabled] { opacity: .55; cursor: default; transform: none; }
    .auth-btn--google { background: var(--bg-raise); }
    .auth-or {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0; color: var(--text-dim); font-size: 12.5px;
      text-transform: uppercase; letter-spacing: .08em;
    }
    .auth-or::before, .auth-or::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .auth-field { display: block; margin-bottom: 12px; }
    .auth-field span {
      display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px;
    }
    .auth-field input {
      width: 100%; padding: 11px 13px; font-size: 15px; font-family: inherit;
      color: var(--text); background: var(--bg-raise);
      border: 1px solid var(--border); border-radius: 11px; outline: none;
      transition: border-color .15s;
    }
    .auth-field input:focus { border-color: var(--accent); }
    .auth-primary {
      width: 100%; padding: 12px 16px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 12px; cursor: pointer;
      background: var(--accent); color: var(--on-accent);
      transition: transform .15s, box-shadow .15s;
    }
    .auth-primary:hover { transform: translateY(-1px);
      box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 45%, transparent); }
    .auth-primary[disabled] { opacity: .6; transform: none; box-shadow: none; }
    .auth-msg {
      margin-top: 14px; padding: 11px 13px; border-radius: 11px;
      font-size: 14px; line-height: 1.45; display: none;
    }
    .auth-msg[data-kind='error'] {
      display: block; background: color-mix(in srgb, #f38ba8 16%, transparent);
      border: 1px solid color-mix(in srgb, #f38ba8 45%, transparent);
      color: var(--text);
    }
    .auth-msg[data-kind='ok'] {
      display: block; background: color-mix(in srgb, var(--accent2) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent2) 45%, transparent);
      color: var(--text);
    }
    .auth-switch { text-align: center; font-size: 14px; color: var(--text-dim);
      margin-top: 20px; }
    .auth-switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .auth-switch a:hover { text-decoration: underline; }
    .auth-fineprint { font-size: 12.5px; color: var(--text-dim); line-height: 1.55;
      text-align: center; margin-top: 18px; }
    .auth-foot { text-align: center; font-size: 13px; color: var(--text-dim); }
    .auth-foot a { color: var(--text-dim); }
    .g-mark { width: 18px; height: 18px; }
  </style>
</head>
<body>
<div class="auth-wrap">

  <header class="auth-top">
    <a class="brand" href="/"><span class="brand-mark">🧠</span> Cortex</a>
    <a class="btn btn-ghost" href="/">Back to site</a>
  </header>

  <!-- mode is set from /login vs /signup by auth-page.js -->
  <main class="auth-card" id="auth-card">
    <h1 id="auth-title">Sign in to Cortex</h1>
    <p class="auth-sub" id="auth-sub">Pick up where you left off — your workspaces,
      notes and explanations are waiting.</p>

    <button class="auth-btn auth-btn--google" id="google-btn" type="button">
      <svg class="g-mark" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C36.9 40.2 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/>
      </svg>
      <span id="google-label">Continue with Google</span>
    </button>

    <div class="auth-or">or</div>

    <form id="email-form" novalidate>
      <label class="auth-field">
        <span>Email</span>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="you@example.com" required>
      </label>
      <button class="auth-primary" id="email-btn" type="submit">Send me a sign-in link</button>
    </form>

    <div class="auth-msg" id="auth-msg" role="status" aria-live="polite"></div>

    <p class="auth-switch" id="auth-switch"></p>
    <p class="auth-fineprint" id="auth-fineprint">
      No password to remember. Cortex never sees your model key — you bring your own.
    </p>
  </main>

  <footer class="auth-foot">
    <a href="/">Cortex</a> · free tier, no card required
  </footer>
</div>

<!-- Classic script (like marked.min.js): runs before the module graph loads,
     so window.supabase is ready when auth-page.js executes. -->
<script src="/vendor/supabase.js"></script>
<script type="module" src="/js/auth-page.js"></script>
</body>
</html>
